name: Build APK

on:
    pull_request:
        branches: [main]
        types: [labeled, opened, synchronize, reopened]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build-apk:
        name: Build APK (foss debug)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up JDK 17
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 17

            - name: Build foss debug APK
              run: ./gradlew :app:assembleFossDebug --console=plain

            - name: Upload APK artifact
              uses: actions/upload-artifact@v6
              with:
                  name: fossify-phone-foss-debug
                  path: app/build/outputs/apk/foss/debug/*.apk
                  retention-days: 14
