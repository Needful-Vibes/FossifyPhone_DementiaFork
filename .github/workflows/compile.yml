name: Compile

on:
    pull_request:
        branches: [main]
        types: [labeled, opened, synchronize, reopened]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    compile:
        name: Compile app (foss debug)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up JDK 17
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 17

            - name: Compile foss debug Kotlin and resources
              run: ./gradlew :app:compileFossDebugSources --console=plain
